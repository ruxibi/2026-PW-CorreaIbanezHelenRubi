<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Asistencia - CECyT 9</title>
  <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
  <header>
    <a href="./detalle.html">Volver al taller</a>

  </header>
  <main>
    <form class="formulario-registro">
    <h1>
      REGISTRAR ASISTENCIA
    </h1>
  <label for="nombre">Nombre</label>
  <input type="text" id="nombre" name="nombre" required>


  <label for="boleta">Número de boleta: </label>
  <input type="text" id="boleta" name="boleta" required>


  <button type="submit" class="subir">Registrar</button>
  <button type="reset" class="resetear">Limpiar</button>
   
  <div class="mensajeexito">
    <div class="contenidoven">
       <p id="mensajeexito" class="mensjaeoculto">Su registro se ha completado con éxito</p>
       <a href="#" class="btnaceptar">Aceptar</a>
    </div>
  </div>

</form>
  </main>
</body>
</html>
